        .stat-val { font-size: 1rem; font-weight: bold; color: #00ff44; }
        .stat-lbl { font-size: 0.62rem; color: #555; text-transform: uppercase; letter-spacing: 1px; }

        /* MAP CONTAINER */
        #map-wrap {
            display: flex;
            height: calc(100vh - 100px);
        }

        #map {
            flex: 1;
            z-index: 1;
        }

            width: 320px;

            border-left: 1px solid #1a1a1a;

            display: flex;
            flex-direction: column;
            flex-shrink: 0;

            padding: 15px;
            border-bottom: 1px solid #1a1a1a;
            background: #0d1a0d;
        }
        #pitch-panel-header h3 {

            font-size: 1.1rem; font-weight: bold;

        }
        .pitch-location {
            font-size: 0.78rem; color: #888;
            margin-bottom: 15px;
        }
        .pitch-surface {
            display: inline-block;
            background: #1a3a1a; border: 1px solid #00aa00;
            color: #00ff44; font-size: 0.68rem;
            padding: 2px 8px; border-radius: 10px;
            margin-bottom: 15px;
        }

            gap: 10px; margin-bottom: 18px;
        }
        .pitch-stat {
            background: #0d0d0d; border: 1px solid #222;
            border-radius: 6px; padding: 10px; text-align: center;
        }
        .pitch-stat-val { font-size: 1rem; font-weight: bold; color: #fff; }
        .pitch-stat-lbl { font-size: 0.65rem; color: #555; text-transform: uppercase; margin-top: 2px; }

            font-size: 0.8rem; color: #888;
            line-height: 1.6; margin-bottom: 18px;
            border-left: 3px solid #1a3a1a;
            padding-left: 10px;
        }

            font-size: 0.78rem; color: #aaa;
            margin-bottom: 15px; line-height: 1.5;

            color: #00ff44; font-size: 0.72rem;
            padding: 4px 10px; border-radius: 20px;
            margin-bottom: 12px;
        }
        .active-dot {
            width: 7px; height: 7px;
            background: #00ff44; border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

            0%,100% { opacity: 1; }

            background: #111;

    { id:'keb1', name:'Birnin Kebbi Pitch', area:'Central', state:'Kebbi', lat:12.4539, lng:4.1975, surface:'Sand', vibe:'Riverside state. River Niger flows nearby.', active:false },

    // JIGAWA
    { id:'jig1', name:'Dutse Pitch', area:'Central', state:'Jigawa', lat:11.8578, lng:9.3489, surface:'Sand', vibe:'New state, old values. Respectful but competitive.', active:false },

    // KOGI
    { id:'kog1', name:'Lokoja Confluence Pitch', area:'Confluence', state:'Kogi', lat:7.7939, lng:6.7376, surface:'Grass', vibe:'Where Niger meets Benue. Two rivers, double energy.', active:true  },
    { id:'kog2', name:'Anyigba Pitch', area:'Anyigba', state:'Kogi', lat:7.4900, lng:7.1900, surface:'Dirt', vibe:'University town. Students bring tactics from around Nigeria.', active:false },

    // BENUE
    { id:'ben1', name:'Makurdi North Bank Pitch', area:'North Bank', state:'Benue', lat:7.7333, lng:8.5333, surface:'Grass', vibe:'Food basket of the nation. Well fed, well played.', active:false },
    { id:'ben2', name:'Otukpo Pitch', area:'Otukpo', state:'Benue', lat:7.1833, lng:8.1333, surface:'Dirt', vibe:'Idoma land. Warrior spirit on the pitch.', active:false },
];

// =====================================================
// MAP INIT
// =====================================================
const map = L.map('map', {
    center:  [9.0820, 8.6753],
    zoom:    6,
    minZoom: 6,
    maxZoom: 16,
    maxBoundsViscosity: 1.0
});

// Dark OpenStreetMap tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>',
    subdomains:  ['a','b','c']
}).addTo(map);

// Nigeria bounds
const nigeriaBounds = L.latLngBounds(
    L.latLng(4.2, 2.7),
    L.latLng(13.9, 14.7)
);
map.setMaxBounds(nigeriaBounds);

// =====================================================
// MARKERS
// =====================================================
const markers      = {};
let   activePitch  = null;

// Custom icons
function makeIcon(active) {
    return L.divIcon({
        className: '',
        html: `<div style="
            width:${active?'22':'18'}px;
            height:${active?'22':'18'}px;
            background:${active?'#00ff44':'#555'};
            border:2px solid ${active?'#fff':'#333'};
            border-radius:50%;
            box-shadow:${active?'0 0 8px rgba(0,255,68,0.7)':'none'};
            display:flex;align-items:center;justify-content:center;
            font-size:${active?'11':'9'}px;
        ">⚽</div>`,
        iconSize:   [active?22:18, active?22:18],
        iconAnchor: [active?11:9, active?11:9]
    });
}

// Add all markers
PITCHES.forEach(p => {
    const marker = L.marker([p.lat, p.lng], {
        icon: makeIcon(p.active)
    }).addTo(map);

    marker.bindTooltip(p.name, {
        permanent:  false,
        className:  'leaflet-tooltip',
        offset:     [0, -10],
        direction:  'top'
    });

    marker.on('click', () => selectPitch(p));
    markers[p.id] = marker;
});

// =====================================================
// STATE FILTER
// =====================================================
const states = [...new Set(PITCHES.map(p => p.state))].sort();
const sel    = document.getElementById('state-select');
states.forEach(s => {
    const opt   = document.createElement('option');
    opt.value   = s;
    opt.textContent = s;
    sel.appendChild(opt);
});

function filterByState(state) {
    const list = document.getElementById('pitch-list');
    list.innerHTML = '';

    const filtered = state
        ? PITCHES.filter(p => p.state === state)
        : [];

    if (!filtered.length) return;

    // Fly to state
    const lats  = filtered.map(p => p.lat);
    const lngs  = filtered.map(p => p.lng);
    const bounds = L.latLngBounds(
        [Math.min(...lats) - 0.3, Math.min(...lngs) - 0.3],
        [Math.max(...lats) + 0.3, Math.max(...lngs) + 0.3]
    );
    map.flyToBounds(bounds, { duration: 1.2 });

    filtered.forEach(p => {
        const item       = document.createElement('div');
        item.className   = 'pitch-list-item';
        item.id          = `pli-${p.id}`;
        item.innerHTML   = `
            <div class="pli-dot"
                style="background:${p.active?'#00ff44':'#444'}"></div>
            <div>
                <div class="pli-name">${p.name}</div>
                <div class="pli-state">${p.area} · ${p.surface}</div>
            </div>`;
        item.onclick     = () => {
            selectPitch(p);
            map.flyTo([p.lat, p.lng], 14, { duration: 1 });
        };
        list.appendChild(item);
    });
}

// =====================================================
// SELECT PITCH
// =====================================================
function selectPitch(p) {
    activePitch = p;

    // Update list highlight
    document.querySelectorAll('.pitch-list-item')
        .forEach(el => el.classList.remove('active'));
    const pli = document.getElementById(`pli-${p.id}`);
    if (pli) pli.classList.add('active');

    // Render detail card
    const card = document.getElementById('pitch-card');
    document.querySelector('.no-selection').style.display = 'none';
    card.classList.add('active');

    card.innerHTML = `
        ${p.active ? `
        <div class="active-badge">
            <div class="active-dot"></div>
            Live Match in Progress
        </div>` : ''}

        <div class="pitch-name">${p.name}</div>
        <div class="pitch-location">📍 ${p.area}, ${p.state}</div>
        <span class="pitch-surface">${p.surface} Surface</span>

        <div class="pitch-stats">
            <div class="pitch-stat">
                <div class="pitch-stat-val">${p.state}</div>
                <div class="pitch-stat-lbl">State</div>
            </div>
            <div class="pitch-stat">
                <div class="pitch-stat-val">${p.surface}</div>
                <div class="pitch-stat-lbl">Surface</div>
            </div>
            <div class="pitch-stat">
                <div class="pitch-stat-val">${p.active ? '🔴 Live' : '⚫ Empty'}</div>
                <div class="pitch-stat-lbl">Status</div>
            </div>
            <div class="pitch-stat">
                <div class="pitch-stat-val">5v5</div>
                <div class="pitch-stat-lbl">Format</div>
            </div>
        </div>

        <div class="pitch-vibe">
            <strong>Street Intel:</strong> ${p.vibe}
        </div>

        <button class="travel-btn disabled" disabled>
            🚶 Travel to This Pitch
        </button>
        <div class="travel-note">
            Travel system coming soon. You will be able to<br>
            move between pitches across Nigeria.
        </div>
    `;
}

// =====================================================
// STATS
// =====================================================
const activePitches  = PITCHES.filter(p => p.active).length;
document.getElementById('stat-pitches').textContent = PITCHES.length;
document.getElementById('stat-active').textContent  = activePitches;
document.getElementById('stat-players').textContent =
    (activePitches * 10).toString(); // placeholder

style.textContent = `

        font-size: 0.75rem !important;
        font-family: Arial, sans-serif !important;
        padding: 4px 10px !important;
        border-radius: 4px !important;
    }

    }

        background: rgba(0,0,0,0.7) !important;
        color: #444 !important;
        font-size: 0.65rem !important;
    }
    .leaflet-control-attribution a { color: #666 !important; }
    .leaflet-control-zoom a {
        background: #111 !important;

        border-color: #333 !important;
    }
    .leaflet-control-zoom a:hover {
        background: #222 !important;
    }
`;
document.head.appendChild(style);
</script>
