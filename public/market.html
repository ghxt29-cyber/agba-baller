<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGBA BALLER — Market 🏪</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        /* HEADER */
        #header {
            width: 100%;
            background: #111;
            border-bottom: 3px solid #cc8800;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        #header h1 { font-size: 1.3rem; color: #ffaa00; letter-spacing: 2px; }
        #header-right { display: flex; align-items: center; gap: 12px; }
        .back-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: none;
        }
        .back-btn:hover { color: #fff; border-color: #555; }
        #player-balance {
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffd700;
        }

        /* MARKET BANNER */
        #market-banner {
            background: linear-gradient(135deg, #1a0a00, #2a1500, #1a0a00);
            border-bottom: 2px solid #cc8800;
            padding: 20px;
            text-align: center;
        }
        #market-banner h2 {
            font-size: 1.8rem;
            color: #ffaa00;
            letter-spacing: 3px;
            margin-bottom: 6px;
        }
        #market-banner p {
            color: #888;
            font-size: 0.85rem;
        }
        .market-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .market-stat {
            text-align: center;
        }
        .market-stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffaa00;
        }
        .market-stat-label {
            font-size: 0.7rem;
            color: #555;
            text-transform: uppercase;
        }

        /* MARKET LAYOUT */
        #market-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        /* SECTION HEADERS */
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 25px 0 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #cc8800;
        }
        .section-header h3 {
            font-size: 1rem;
            color: #ffaa00;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .section-badge {
            background: #cc8800;
            color: #000;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* STALL GRID */
        .stall-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        /* STALL CARD */
        .stall-card {
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }
        .stall-card:hover {
            border-color: #cc8800;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(204,136,0,0.2);
        }
        .stall-top {
            background: linear-gradient(135deg, #1a1000, #2a1800);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #2a2a2a;
        }
        .stall-number {
            background: #cc8800;
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            min-width: 32px;
            text-align: center;
        }
        .stall-number.premium {
            background: #ffd700;
        }
        .stall-vendor-name {
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffaa00;
        }
        .stall-name {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
        }
        .gov-badge {
            margin-left: auto;
            background: #003300;
            border: 1px solid #006600;
            color: #00cc00;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .stall-body {
            padding: 12px 15px;
        }
        .stall-category {
            font-size: 0.7rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .stall-greeting {
            font-size: 0.8rem;
            color: #aaa;
            font-style: italic;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .item-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }
        .item-tag {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            font-size: 0.68rem;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .enter-stall-btn {
            width: 100%;
            background: #cc8800;
            border: none;
            color: #000;
            padding: 8px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: background 0.2s;
        }
        .enter-stall-btn:hover { background: #ffaa00; }

        /* RENTAL SPOTS */
        .rental-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .rental-spot {
            background: #0d0d0d;
            border: 2px dashed #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .rental-spot:hover {
            border-color: #cc8800;
            background: #1a1000;
        }
        .rental-spot.occupied {
            border-style: solid;
            border-color: #444;
            cursor: default;
            opacity: 0.6;
        }
        .rental-spot.occupied:hover {
            border-color: #444;
            background: #0d0d0d;
        }
        .spot-number {
            font-size: 1.2rem;
            font-weight: bold;
            color: #cc8800;
            margin-bottom: 6px;
        }
        .spot-type {
            font-size: 0.7rem;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .spot-rent {
            font-size: 0.82rem;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .spot-status {
            font-size: 0.72rem;
            color: #888;
        }
        .rent-btn {
            background: #1a1a00;
            border: 1px solid #cc8800;
            color: #cc8800;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 6px;
        }
        .rent-btn:hover { background: #2a2a00; }

        /* MODAL */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #modal-overlay.open { display: flex; }
        #stall-modal {
            background: #161616;
            border: 1px solid #cc8800;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            background: linear-gradient(135deg, #1a1000, #2a1800);
            padding: 15px 20px;
            border-bottom: 1px solid #cc8800;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
        }
        .modal-header h3 { color: #ffaa00; font-size: 1rem; }
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .modal-close:hover { color: #fff; background: none; }
        .modal-body { padding: 20px; }

        /* VENDOR DIALOGUE */
        .vendor-bubble {
            background: #1a1000;
            border: 1px solid #cc8800;
            border-radius: 10px;
            border-bottom-left-radius: 2px;
            padding: 12px 15px;
            font-size: 0.85rem;
            color: #ffdd88;
            font-style: italic;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .vendor-name-tag {
            font-size: 0.7rem;
            color: #cc8800;
            font-weight: bold;
            font-style: normal;
            margin-bottom: 5px;
        }

        /* ITEMS LIST */
        .items-list { display: flex; flex-direction: column; gap: 10px; }
        .item-row {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }
        .item-row:hover { border-color: #444; }
        .item-info { flex: 1; }
        .item-name {
            font-size: 0.88rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 3px;
        }
        .item-desc {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 4px;
        }
        .item-effect {
            font-size: 0.72rem;
            color: #00cc44;
        }
        .item-stock {
            font-size: 0.7rem;
            color: #555;
            margin-top: 2px;
        }
        .item-price-area { text-align: right; }
        .item-price {
            font-size: 1rem;
            font-weight: bold;
            color: #ffd700;
            display: block;
            margin-bottom: 5px;
        }
        .buy-btn {
            background: #cc8800;
            border: none;
            color: #000;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.78rem;
            display: block;
            width: 100%;
            margin: 0;
        }
        .buy-btn:hover { background: #ffaa00; }
        .haggle-btn {
            background: #1a1a00;
            border: 1px solid #cc8800;
            color: #cc8800;
            padding: 5px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            display: block;
            width: 100%;
            margin: 3px 0 0;
        }
        .haggle-btn:hover { background: #2a2a00; }

        /* HAGGLE PANEL */
        .haggle-panel {
            background: #0a0a00;
            border: 1px solid #554400;
            border-radius: 6px;
            padding: 10px;
            margin-top: 8px;
            display: none;
        }
        .haggle-panel.open { display: block; }
        .haggle-panel label {
            font-size: 0.75rem;
            color: #888;
            display: block;
            margin-bottom: 5px;
        }
        .haggle-input {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #554400;
            color: #ffd700;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
            margin-bottom: 6px;
        }
        .haggle-submit {
            background: #554400;
            border: none;
            color: #ffaa00;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: bold;
            margin: 0;
        }
        .haggle-submit:hover { background: #776600; }

        /* VENDOR RESPONSE */
        .vendor-response {
            background: #1a1000;
            border-left: 3px solid #cc8800;
            padding: 8px 12px;
            font-size: 0.82rem;
            color: #ffdd88;
            font-style: italic;
            margin-top: 8px;
            border-radius: 0 4px 4px 0;
            display: none;
            line-height: 1.4;
        }
        .vendor-response.open { display: block; }

        /* NOTIFICATION */
        #notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0b1f0b;
            border: 2px solid #00aa00;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #00ff44;
            z-index: 999;
            display: none;
            text-align: center;
        }
        #notification.error {
            background: #1f0b0b;
            border-color: #aa0000;
            color: #ff4444;
        }
        #notification.info {
            background: #0a0a1f;
            border-color: #4444aa;
            color: #aaaaff;
        }

        /* RENT MODAL */
        #rent-modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #rent-modal-overlay.open { display: flex; }
        #rent-modal {
            background: #161616;
            border: 1px solid #cc8800;
            border-radius: 12px;
            width: 90%;
            max-width: 440px;
            padding: 25px;
        }
        #rent-modal h3 { color: #ffaa00; margin-bottom: 15px; font-size: 1rem; }
        .rent-modal-input {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9rem;
            outline: none;
            margin-bottom: 10px;
        }
        .rent-modal-input:focus { border-color: #cc8800; }
        .rent-confirm-btn {
            width: 100%;
            background: #cc8800;
            border: none;
            color: #000;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .rent-confirm-btn:hover { background: #ffaa00; }
        .rent-cancel-btn {
            width: 100%;
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .rent-cancel-btn:hover { color: #fff; border-color: #555; background: transparent; }

        /* LOADING */
        #loading {
            text-align: center;
            padding: 60px 20px;
            color: #555;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .stall-grid { grid-template-columns: 1fr; }
            .rental-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<!-- NOTIFICATION -->
<div id="notification"></div>

<!-- HEADER -->
<div id="header">
    <h1>🏪 AGBA BALLER MARKET</h1>
    <div id="header-right">
        <span id="player-balance">₦---</span>
        <a href="/" class="back-btn">⚽ Back to Pitch</a>
    </div>
</div>

<!-- MARKET BANNER -->
<div id="market-banner">
    <h2>🏪 THE MARKET</h2>
    <p>Buy, sell and hustle — the Nigerian way</p>
    <div class="market-stats">
        <div class="market-stat">
            <div class="market-stat-value" id="stat-stalls">—</div>
            <div class="market-stat-label">Active Stalls</div>
        </div>
        <div class="market-stat">
            <div class="market-stat-value" id="stat-items">—</div>
            <div class="market-stat-label">Items Available</div>
        </div>
        <div class="market-stat">
            <div class="market-stat-value" id="stat-vendors">—</div>
            <div class="market-stat-label">Vendors</div>
        </div>
        <div class="market-stat">
            <div class="market-stat-value" id="stat-spots">—</div>
            <div class="market-stat-label">Open Spots</div>
        </div>
    </div>
</div>

<!-- MAIN MARKET CONTAINER -->
<div id="market-container">
    <div id="loading">⏳ Loading market stalls...</div>
</div>

<!-- STALL MODAL -->
<div id="modal-overlay" onclick="closeModal(event)">
    <div id="stall-modal">
        <div class="modal-header">
            <h3 id="modal-stall-name">Stall</h3>
            <button class="modal-close" onclick="closeStallModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="vendor-bubble">
                <div class="vendor-name-tag" id="modal-vendor-name"></div>
                <div id="modal-greeting"></div>
            </div>
            <div class="items-list" id="modal-items"></div>
        </div>
    </div>
</div>

<!-- RENT MODAL -->
<div id="rent-modal-overlay" onclick="closeRentModal(event)">
    <div id="rent-modal">
        <h3>🏪 Rent a Stall</h3>
        <p style="color:#888;font-size:0.82rem;margin-bottom:15px;" id="rent-spot-info"></p>
        <input class="rent-modal-input" id="rent-stall-name"
            placeholder="Your stall name (e.g. Emeka's Boot Store)">
        <button class="rent-confirm-btn" onclick="confirmRent()">
            Pay Rent & Open Stall
        </button>
        <button class="rent-cancel-btn" onclick="closeRentModal()">Cancel</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// =====================================================
// AGBA BALLER MARKET
// =====================================================
let sb              = null;
let currentSession  = null;
let currentBalance  = 0;
let selectedSpot    = null;
let activeStallId   = null;
let activeStall     = null;
let haggleRounds    = {};

// =====================================================
// INIT
// =====================================================
fetch('/api/config')
    .then(r => r.json())
    .then(cfg => {
        sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
        initMarket();
    });

async function initMarket() {
    // Check login
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
        currentSession = session;
        await loadPlayerBalance(session.access_token);
    } else {
        document.getElementById('player-balance').textContent = 'Guest';
    }

    // Load market
    await loadMarket();
}

async function loadPlayerBalance(token) {
    try {
        const res  = await fetch('/api/player', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (data.success) {
            currentBalance = data.player.naira_balance;
            document.getElementById('player-balance').textContent =
                '₦' + Number(currentBalance).toLocaleString('en-NG');
        }
    } catch (e) {}
}

async function loadMarket() {
    try {
        const res  = await fetch('/api/market/stalls');
        const data = await res.json();
        if (!data.success) return;

        // Update stats
        const totalItems = data.govStalls.reduce((n, s) => n + s.items.length, 0)
                         + data.playerStalls.reduce((n, s) => n + s.items.length, 0);
        const openSpots  = data.rentalSpots.filter(s => !s.isOccupied).length;

        document.getElementById('stat-stalls').textContent =
            data.govStalls.length + data.playerStalls.length;
        document.getElementById('stat-items').textContent   = totalItems;
        document.getElementById('stat-vendors').textContent =
            data.govStalls.length + data.playerStalls.length;
        document.getElementById('stat-spots').textContent   = openSpots;

        // Render market
        renderMarket(data);

    } catch (e) {
        document.getElementById('loading').textContent = '⚠️ Could not load market. Is the server running?';
    }
}

function renderMarket(data) {
    const container = document.getElementById('market-container');
    container.innerHTML = '';

    // ── GOVERNMENT STALLS ──
    const govSection = document.createElement('div');
    govSection.innerHTML = `
        <div class="section-header">
            <h3>🏛️ Government Stalls</h3>
            <span class="section-badge">OFFICIAL</span>
        </div>
        <div class="stall-grid" id="gov-stall-grid"></div>
    `;
    container.appendChild(govSection);

    const govGrid = govSection.querySelector('#gov-stall-grid');
    for (const stall of data.govStalls) {
        govGrid.appendChild(buildStallCard(stall));
    }

    // ── PLAYER STALLS ──
    if (data.playerStalls.length > 0) {
        const playerSection = document.createElement('div');
        playerSection.innerHTML = `
            <div class="section-header">
                <h3>👤 Player Stalls</h3>
                <span class="section-badge">COMMUNITY</span>
            </div>
            <div class="stall-grid" id="player-stall-grid"></div>
        `;
        container.appendChild(playerSection);

        const playerGrid = playerSection.querySelector('#player-stall-grid');
        for (const stall of data.playerStalls) {
            playerGrid.appendChild(buildStallCard(stall));
        }
    }

    // ── RENTAL SPOTS ──
    const rentSection = document.createElement('div');
    rentSection.innerHTML = `
        <div class="section-header">
            <h3>🏗️ Rent A Stall</h3>
            <span class="section-badge">OPEN SPOTS</span>
        </div>
        <p style="color:#666;font-size:0.82rem;margin-bottom:15px;">
            Set up your own business in the market. Sell anything you want to other players.
            Basic stalls: ₦15,000/month. Premium corner stalls: ₦25,000/month.
        </p>
        <div class="rental-grid" id="rental-grid"></div>
    `;
    container.appendChild(rentSection);

    const rentalGrid = rentSection.querySelector('#rental-grid');
    for (const spot of data.rentalSpots) {
        rentalGrid.appendChild(buildRentalSpot(spot));
    }
}

function buildStallCard(stall) {
    const card = document.createElement('div');
    card.className = 'stall-card';
    card.onclick   = () => openStall(stall);

    const itemPreview = stall.items.slice(0, 3)
        .map(i => `<span class="item-tag">${i.name}</span>`)
        .join('');

    card.innerHTML = `
        <div class="stall-top">
            <span class="stall-number">${stall.stallNumber}</span>
            <div>
                <div class="stall-vendor-name">${stall.vendorName}</div>
                <div class="stall-name">${stall.stallName}</div>
            </div>
            ${stall.type === 'government'
                ? '<span class="gov-badge">GOV</span>'
                : '<span class="gov-badge" style="background:#111;border-color:#555;color:#888;">PRIVATE</span>'
            }
        </div>
        <div class="stall-body">
            <div class="stall-category">${stall.category}</div>
            <div class="stall-greeting">"${stall.greeting}"</div>
            <div class="item-preview">${itemPreview}
                ${stall.items.length > 3
                    ? `<span class="item-tag">+${stall.items.length - 3} more</span>`
                    : ''}
            </div>
            <button class="enter-stall-btn">Enter Stall →</button>
        </div>
    `;
    return card;
}

function buildRentalSpot(spot) {
    const div = document.createElement('div');
    div.className = `rental-spot${spot.isOccupied ? ' occupied' : ''}`;

    if (spot.isOccupied) {
        div.innerHTML = `
            <div class="spot-number">${spot.stallNumber}</div>
            <div class="spot-type">${spot.type}</div>
            <div class="spot-status">🔒 Occupied</div>
        `;
    } else {
        div.onclick = () => openRentModal(spot);
        div.innerHTML = `
            <div class="spot-number">${spot.stallNumber}</div>
            <div class="spot-type">${spot.type === 'premium' ? '⭐ Premium' : 'Basic'}</div>
            <div class="spot-rent">₦${spot.monthlyRent.toLocaleString()}/month</div>
            <div class="spot-status">✅ Available</div>
            <button class="rent-btn">Rent Now</button>
        `;
    }
    return div;
}

// =====================================================
// STALL MODAL
// =====================================================
function openStall(stall) {
    activeStallId = stall.id;
    activeStall   = stall;
    haggleRounds  = {};

    document.getElementById('modal-stall-name').textContent  = stall.stallName;
    document.getElementById('modal-vendor-name').textContent = stall.vendorName + ' says:';
    document.getElementById('modal-greeting').textContent    = stall.greeting;

    // Build items
    const itemsList = document.getElementById('modal-items');
    itemsList.innerHTML = '';

    if (!stall.items || stall.items.length === 0) {
        itemsList.innerHTML = '<p style="color:#555;text-align:center;padding:20px;">No items available right now.</p>';
    } else {
        for (const item of stall.items) {
            itemsList.appendChild(buildItemRow(item, stall));
        }
    }

    document.getElementById('modal-overlay').classList.add('open');
}

function buildItemRow(item, stall) {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.id        = `item-row-${item.id}`;

    const effectLabel = formatEffect(item.effect);

    row.innerHTML = `
        <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.description || ''}</div>
            <div class="item-effect">${effectLabel}</div>
            <div class="item-stock">Stock: ${item.stock > 100 ? '∞' : item.stock}</div>
        </div>
        <div class="item-price-area">
            <span class="item-price">₦${Number(item.price).toLocaleString()}</span>
            <button class="buy-btn" onclick="buyItem('${stall.id}', '${item.id}', ${item.price})">
                Buy
            </button>
            <button class="haggle-btn" onclick="toggleHaggle('${item.id}', ${item.price})">
                💬 Haggle
            </button>
            <div class="haggle-panel" id="haggle-${item.id}">
                <label>Your offer:</label>
                <input class="haggle-input" id="offer-${item.id}"
                    type="number"
                    placeholder="₦ your price"
                    min="1"
                    value="${Math.floor(item.price * 0.85)}">
                <button class="haggle-submit"
                    onclick="submitHaggle('${stall.id}', '${item.id}', ${item.price})">
                    Submit Offer
                </button>
                <div class="vendor-response" id="response-${item.id}"></div>
            </div>
        </div>
    `;
    return row;
}

function formatEffect(effect) {
    if (!effect || effect === 'none') return '';
    const parts = [];
    if (effect.includes('stamina')) {
        const m = effect.match(/stamina\+(\d+)/);
        if (m) parts.push(`⚡ +${m[1]}% Stamina`);
    }
    if (effect.includes('health')) parts.push('💊 Restores Health');
    if (effect.includes('speed')) {
        const m = effect.match(/speed\+(\d+)/);
        if (m) parts.push(`💨 +${m[1]} Speed`);
    }
    if (effect.includes('kit')) parts.push('👕 Upgrades Kit');
    return parts.join(' · ');
}

function toggleHaggle(itemId, price) {
    const panel = document.getElementById(`haggle-${itemId}`);
    panel.classList.toggle('open');
    // Reset response
    const resp = document.getElementById(`response-${itemId}`);
    resp.classList.remove('open');
    resp.textContent = '';
}

async function submitHaggle(stallId, itemId, originalPrice) {
    if (!currentSession) {
        showNotification('Sign in to haggle!', 'error'); return;
    }

    const offerInput = document.getElementById(`offer-${itemId}`);
    const offer      = parseInt(offerInput.value);
    if (!offer || offer <= 0) {
        showNotification('Enter a valid offer!', 'error'); return;
    }

    const rounds = haggleRounds[itemId] || 0;
    if (rounds >= 3) {
        showNotification('Maximum haggle rounds reached!', 'error'); return;
    }

    haggleRounds[itemId] = rounds + 1;

    try {
        const res  = await fetch('/api/market/buy', {
            method: 'POST',
            headers: {
                'Content-Type':  'application/json',
                'Authorization': 'Bearer ' + currentSession.access_token
            },
            body: JSON.stringify({
                stallId,
                itemId,
                offeredPrice: offer
            })
        });
        const data = await res.json();

        const respEl = document.getElementById(`response-${itemId}`);
        respEl.textContent = data.vendorResponse || data.message;
        respEl.classList.add('open');

        if (data.success) {
            // Deal made!
            currentBalance = data.newBalance;
            document.getElementById('player-balance').textContent =
                '₦' + Number(currentBalance).toLocaleString('en-NG');
            showNotification(
                `✅ Deal! Bought for ₦${data.finalPrice.toLocaleString()}. ${data.effectMessage}`,
                'success'
            );
            haggleRounds[itemId] = 0;
        } else if (data.haggleResult === 'countered') {
            // Vendor countered — update offer input
            const stall = activeStall;
            const item  = stall.items.find(i => i.id === itemId);
            if (item) {
                offerInput.value = data.finalPrice || offer;
            }
        }
    } catch (e) {
        showNotification('Transaction failed. Try again.', 'error');
    }
}

async function buyItem(stallId, itemId, price) {
    if (!currentSession) {
        showNotification('Sign in to buy items!', 'error'); return;
    }
    if (currentBalance < price) {
        showNotification(`Not enough Naira! You need ₦${price.toLocaleString()}.`, 'error');
        return;
    }

    try {
        const res  = await fetch('/api/market/buy', {
            method: 'POST',
            headers: {
                'Content-Type':  'application/json',
                'Authorization': 'Bearer ' + currentSession.access_token
            },
            body: JSON.stringify({ stallId, itemId })
        });
        const data = await res.json();

        if (data.success) {
            currentBalance = data.newBalance;
            document.getElementById('player-balance').textContent =
                '₦' + Number(currentBalance).toLocaleString('en-NG');

            // Show vendor acceptance dialogue
            const respEl = document.getElementById(`response-${itemId}`);
            if (respEl) {
                respEl.textContent = data.vendorResponse;
                respEl.classList.add('open');
            }

            showNotification(
                `✅ Bought! ${data.effectMessage}`,
                'success'
            );
        } else {
            showNotification(data.message || 'Purchase failed.', 'error');
        }
    } catch (e) {
        showNotification('Transaction failed. Try again.', 'error');
    }
}

function closeStallModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    activeStallId = null;
    activeStall   = null;
}

function closeModal(e) {
    if (e.target === document.getElementById('modal-overlay')) {
        closeStallModal();
    }
}

// =====================================================
// RENT MODAL
// =====================================================
function openRentModal(spot) {
    if (!currentSession) {
        showNotification('Sign in to rent a stall!', 'error'); return;
    }
    selectedSpot = spot;
    document.getElementById('rent-spot-info').textContent =
        `Stall ${spot.stallNumber} (${spot.type}) — ₦${spot.monthlyRent.toLocaleString()}/month`;
    document.getElementById('rent-stall-name').value = '';
    document.getElementById('rent-modal-overlay').classList.add('open');
}

async function confirmRent() {
    if (!selectedSpot || !currentSession) return;

    const stallName = document.getElementById('rent-stall-name').value.trim();
    if (!stallName) {
        showNotification('Enter a name for your stall!', 'error'); return;
    }
    if (currentBalance < selectedSpot.monthlyRent) {
        showNotification(
            `Not enough Naira! Need ₦${selectedSpot.monthlyRent.toLocaleString()}.`,
            'error'
        );
        return;
    }

    try {
        const res  = await fetch('/api/market/rent', {
            method: 'POST',
            headers: {
                'Content-Type':  'application/json',
                'Authorization': 'Bearer ' + currentSession.access_token
            },
            body: JSON.stringify({
                spotId:    selectedSpot.id,
                stallName: stallName
            })
        });
        const data = await res.json();

        if (data.success) {
            currentBalance = data.newBalance;
            document.getElementById('player-balance').textContent =
                '₦' + Number(currentBalance).toLocaleString('en-NG');
            showNotification(
                `🏪 Stall rented! Welcome to the market, ${stallName}!`,
                'success'
            );
            closeRentModal();
            // Reload market
            await loadMarket();
        } else {
            showNotification(data.message, 'error');
        }
    } catch (e) {
        showNotification('Rental failed. Try again.', 'error');
    }
}

function closeRentModal(e) {
    if (!e || e.target === document.getElementById('rent-modal-overlay')) {
        document.getElementById('rent-modal-overlay').classList.remove('open');
        selectedSpot = null;
    }
}

// =====================================================
// NOTIFICATION
// =====================================================
let notifTimeout = null;
function showNotification(msg, type = 'success') {
    const el    = document.getElementById('notification');
    el.textContent = msg;
    el.className   = type === 'error' ? 'error' : type === 'info' ? 'info' : '';
    el.style.display = 'block';
    if (notifTimeout) clearTimeout(notifTimeout);
    notifTimeout = setTimeout(() => { el.style.display = 'none'; }, 4000);
}
</script>
