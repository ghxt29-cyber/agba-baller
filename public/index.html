<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGBA BALLER 🇳🇬⚽</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #header {
            width: 100%;
            background: #111;
            border-bottom: 3px solid #00aa00;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #header h1 { font-size: 1.6rem; color: #00ff44; letter-spacing: 2px; }
        #header span { font-size: 0.8rem; color: #888; }
        #connection-status {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: #ff3300;
            color: white;
            font-weight: bold;
        }
        #connection-status.connected { background: #00aa00; }
        #pitch-wrapper {
            width: 95%;
            max-width: 800px;
            margin: 15px auto;
            position: relative;
        }
        #game-canvas {
            width: 100%;
            border: 3px solid #00aa00;
            border-radius: 6px;
            display: block;
            background: #1a3a1a;
        }
        /* CONTROLS HINT */
        #controls-hint {
            text-align: center;
            font-size: 0.72rem;
            color: #555;
            margin-top: 4px;
            margin-bottom: 8px;
        }
        .panel-grid {
            width: 95%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        @media (max-width: 600px) { .panel-grid { grid-template-columns: 1fr; } }
        .panel {
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 15px;
        }
        .panel h3 {
            color: #00ff44;
            font-size: 0.85rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #222;
            padding-bottom: 6px;
        }
        input[type="text"] {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 10px;
            border-radius: 5px;
            font-size: 0.85rem;
            margin-bottom: 8px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #00aa00; }
        button {
            background: #00aa00;
            border: none;
            color: white;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.82rem;
            margin-right: 5px;
            margin-top: 4px;
            transition: background 0.2s;
        }
        button:hover { background: #008800; }
        button.secondary { background: #1a4a8a; }
        button.secondary:hover { background: #133a6a; }
        #invite-box {
            background: #0b1f0b;
            border: 1px dashed #00aa00;
            border-radius: 5px;
            padding: 8px;
            font-size: 0.78rem;
            color: #00ff44;
            margin-top: 8px;
            word-break: break-all;
            display: none;
        }
        #player-list { list-style: none; margin-top: 8px; }
        #player-list li {
            background: #1a1a1a;
            padding: 5px 8px;
            border-radius: 4px;
            margin-bottom: 4px;
            font-size: 0.82rem;
            border-left: 3px solid #00aa00;
        }
        #chat-log {
            background: #0b0b0b;
            height: 130px;
            overflow-y: auto;
            border: 1px solid #1a1a1a;
            border-radius: 5px;
            padding: 8px;
            font-size: 0.78rem;
            margin-bottom: 8px;
        }
        #chat-log p { margin-bottom: 4px; line-height: 1.4; }
        .msg-system { color: #888; }
        .msg-sent { color: #00ffcc; }
        .msg-received { color: #ffaa00; }
        .msg-call { color: #ff6600; }
        .slang-wheel { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .slang-btn {
            background: #1a1a2e;
            border: 1px solid #333;
            color: #aaa;
            padding: 4px 8px;
            font-size: 0.72rem;
            border-radius: 20px;
            cursor: pointer;
            margin: 0;
        }
        .slang-btn:hover { background: #222244; color: #fff; border-color: #555; }
        #scoreboard {
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            width: 95%;
            max-width: 800px;
        }
        #scoreboard .score-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .team-score { font-size: 1.8rem; font-weight: bold; color: #00ff44; }
        .team-label { font-size: 0.75rem; color: #888; }
        .vs { font-size: 1rem; color: #555; }
        #match-timer {
            font-size: 0.8rem;
            color: #ffaa00;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div id="header">
        <h1>⚽ AGBA BALLER 🇳🇬</h1>
        <div id="connection-status">● OFFLINE</div>
        <span>Phase 1 — Street Hustle MVP</span>
    </div>

    <!-- PITCH CANVAS -->
    <div id="pitch-wrapper">
        <canvas id="game-canvas" width="750" height="420"></canvas>
    </div>
    <div id="controls-hint">
        🎮 Move your player: <strong>W A S D</strong> keys &nbsp;|&nbsp; 
        📱 Mobile: tap the pitch to move
    </div>

    <!-- SCOREBOARD -->
    <div id="scoreboard">
        <div class="score-row">
            <div>
                <div class="team-label" id="home-team-name">YOUR CREW</div>
                <div class="team-score" id="home-score">0</div>
            </div>
            <div class="vs">
                VS
                <div id="match-timer">⏱ 00:00</div>
            </div>
            <div>
                <div class="team-label" id="away-team-name">OPPONENTS</div>
                <div class="team-score" id="away-score">0</div>
            </div>
        </div>
    </div>

    <!-- CONTROL PANELS -->
    <div class="panel-grid">

        <!-- PANEL 1: TEAM LOBBY -->
        <div class="panel">
            <h3>👥 Street Crew Lobby</h3>
            <input type="text" id="username-input" placeholder="Your baller name (e.g. Chukwudi)">
            <input type="text" id="team-name-input" placeholder="Your crew name (e.g. Surulere Boys)">
            <div>
                <button onclick="createTeam()">🏟️ Form Crew</button>
                <button class="secondary" onclick="showJoinPanel()">🔗 Join Crew</button>
            </div>
            <div id="join-panel" style="display:none; margin-top:10px;">
                <input type="text" id="invite-code-input" 
                    placeholder="Enter 6-digit invite code">
                <button onclick="joinTeam()">⚽ Join Now</button>
            </div>
            <div id="invite-box"></div>
            <ul id="player-list"></ul>
        </div>

        <!-- PANEL 2: AGBA CHAT -->
        <div class="panel">
            <h3>💬 AgbaChat — E2EE Secured</h3>
            <div id="chat-log">
                <p class="msg-system">
                    🔒 End-to-End Encryption Active. 
                    Server cannot read your messages.
                </p>
            </div>
            <input type="text" id="msg-input" 
                placeholder="Type your message..."
                onkeypress="if(event.key==='Enter') sendMessage()">
            <div>
                <button onclick="sendMessage()">Send 📤</button>
                <button class="secondary" onclick="simulateVoiceNote()">
                    🎙️ Voice Note
                </button>
                <button class="secondary" onclick="simulateCall()">📞 Call</button>
            </div>
            <div class="slang-wheel">
                <button class="slang-btn" onclick="sendSlang('Open legs! 🦵')">
                    Open legs!
                </button>
                <button class="slang-btn" onclick="sendSlang('Overs! ⬆️')">
                    Overs!
                </button>
                <button class="slang-btn" onclick="sendSlang('Find me! 👋')">
                    Find me!
                </button>
                <button class="slang-btn" onclick="sendSlang('E don do! 🎉')">
                    E don do!
                </button>
                <button class="slang-btn" onclick="sendSlang('Shoot am! 🥅')">
                    Shoot am!
                </button>
                <button class="slang-btn" onclick="sendSlang('My guy! 🤝')">
                    My guy!
                </button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
    // ================================================
    // AGBA BALLER - Phase 1 Game Client
    // ================================================
    const socket = io();
    const statusEl = document.getElementById('connection-status');

    // --- CONNECTION ---
    socket.on('connect', () => {
        statusEl.textContent = '● LIVE';
        statusEl.classList.add('connected');
        addChatMsg('system', '✅ Connected to AGBA BALLER server.');
    });
    socket.on('disconnect', () => {
        statusEl.textContent = '● OFFLINE';
        statusEl.classList.remove('connected');
        addChatMsg('system', '❌ Disconnected from server.');
    });

    // ================================================
    // CANVAS & PITCH SETUP
    // ================================================
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // ================================================
    // GAME STATE
    // ================================================
    // My local player
    let myPlayer = null;
    let myUsername = '';

    // All players visible on pitch (keyed by socketId)
    const pitchPlayers = {};

    // Ball state
    const ball = {
        x: W / 2, y: H / 2,
        radius: 9,
        vx: 0, vy: 0,
        friction: 0.97
    };

    // Score
    let homeScore = 0;
    let awayScore = 0;

    // Match timer
    let matchSeconds = 0;
    let timerInterval = null;

    // Player colours — home team green, away team yellow
    const HOME_COLOR = '#00cc44';
    const AWAY_COLOR = '#ffcc00';
    const BALL_CARRIER_COLOR = '#ff4444';

    // Keys held down
    const keys = {};
    document.addEventListener('keydown', e => { keys[e.key] = true; });
    document.addEventListener('keyup',  e => { keys[e.key] = false; });

    // ================================================
    // DRAW FUNCTIONS
    // ================================================
    function drawPitch() {
        // Grass
        ctx.fillStyle = '#1e4d1e';
        ctx.fillRect(0, 0, W, H);

        // Pitch lines
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 20, W - 40, H - 40);

        // Centre line
        ctx.beginPath();
        ctx.moveTo(W / 2, 20);
        ctx.lineTo(W / 2, H - 20);
        ctx.stroke();

        // Centre circle
        ctx.beginPath();
        ctx.arc(W / 2, H / 2, 55, 0, Math.PI * 2);
        ctx.stroke();

        // Centre dot
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(W / 2, H / 2, 4, 0, Math.PI * 2);
        ctx.fill();

        // Left penalty box
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.strokeRect(20, H/2 - 70, 90, 140);

        // Right penalty box
        ctx.strokeRect(W - 110, H/2 - 70, 90, 140);

        // MONKEY POSTS — Left
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(12, H/2 - 35, 8, 70);
        ctx.fillStyle = '#A0522D';
        ctx.fillRect(12, H/2 - 37, 8, 4);
        ctx.fillRect(12, H/2 + 33, 8, 4);

        // MONKEY POSTS — Right
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(W - 20, H/2 - 35, 8, 70);
        ctx.fillStyle = '#A0522D';
        ctx.fillRect(W - 20, H/2 - 37, 8, 4);
        ctx.fillRect(W - 20, H/2 + 33, 8, 4);
    }

    function drawBall() {
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(ball.x + 3, ball.y + 4, ball.radius, ball.radius * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ball
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Ball pattern
        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius * 0.5, 0, Math.PI * 2);
        ctx.stroke();
    }

    function drawPlayer(p) {
        const color = p.isHome ? HOME_COLOR : AWAY_COLOR;
        const r = 14; // player radius

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(p.x + 2, p.y + r + 2, r * 0.7, r * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Body circle
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();

        // Border
        ctx.strokeStyle = p.isMe ? '#ffffff' : 'rgba(0,0,0,0.4)';
        ctx.lineWidth = p.isMe ? 2.5 : 1.5;
        ctx.stroke();

        // Name tag
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px Arial';
        ctx.textAlign = 'center';
        // Trim long names
        const label = p.username.length > 8
            ? p.username.substring(0, 7) + '.'
            : p.username;
        ctx.fillText(label, p.x, p.y - r - 4);

        // "ME" indicator
        if (p.isMe) {
            ctx.fillStyle = '#00ff44';
            ctx.font = 'bold 8px Arial';
            ctx.fillText('YOU', p.x, p.y + 4);
        }
    }

    // ================================================
    // GAME LOOP
    // ================================================
    function gameLoop() {
        // Clear
        ctx.clearRect(0, 0, W, H);

        // Draw pitch
        drawPitch();

        // Move MY player with WASD
        if (myPlayer) {
            const speed = 3;
            if (keys['w'] || keys['W'] || keys['ArrowUp'])    myPlayer.y -= speed;
            if (keys['s'] || keys['S'] || keys['ArrowDown'])  myPlayer.y += speed;
            if (keys['a'] || keys['A'] || keys['ArrowLeft'])  myPlayer.x -= speed;
            if (keys['d'] || keys['D'] || keys['ArrowRight']) myPlayer.x += speed;

            // Keep player inside pitch boundaries
            myPlayer.x = Math.max(28, Math.min(W - 28, myPlayer.x));
            myPlayer.y = Math.max(28, Math.min(H - 28, myPlayer.y));

            // Check if my player kicks the ball
            const dx = myPlayer.x - ball.x;
            const dy = myPlayer.y - ball.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 14 + ball.radius) {
                // Kick ball away from player
                const angle = Math.atan2(ball.y - myPlayer.y, ball.x - myPlayer.x);
                ball.vx = Math.cos(angle) * 6;
                ball.vy = Math.sin(angle) * 6;
            }

            // Send my position to server
            socket.emit('player_move', {
                x: myPlayer.x,
                y: myPlayer.y,
                username: myPlayer.username,
                isHome: myPlayer.isHome
            });

            // Update in pitchPlayers too
            pitchPlayers[socket.id] = myPlayer;
        }

        // Move ball
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx *= ball.friction;
        ball.vy *= ball.friction;

        // Ball wall bouncing
        if (ball.x - ball.radius < 20) {
            ball.x = 20 + ball.radius;
            ball.vx *= -0.7;
        }
        if (ball.x + ball.radius > W - 20) {
            ball.x = W - 20 - ball.radius;
            ball.vx *= -0.7;
        }
        if (ball.y - ball.radius < 20) {
            ball.y = 20 + ball.radius;
            ball.vy *= -0.7;
        }
        if (ball.y + ball.radius > H - 20) {
            ball.y = H - 20 - ball.radius;
            ball.vy *= -0.7;
        }

        // GOAL DETECTION — Left goal
        if (ball.x - ball.radius <= 20 &&
            ball.y > H/2 - 35 && ball.y < H/2 + 35) {
            awayScore++;
            document.getElementById('away-score').textContent = awayScore;
            addChatMsg('system', '🥅 GOAL! Away team scores!');
            resetBall();
        }

        // GOAL DETECTION — Right goal
        if (ball.x + ball.radius >= W - 20 &&
            ball.y > H/2 - 35 && ball.y < H/2 + 35) {
            homeScore++;
            document.getElementById('home-score').textContent = homeScore;
            addChatMsg('system', '🥅 GOAL! Home team scores! E don do!');
            resetBall();
        }

        // Draw all players
        for (const id in pitchPlayers) {
            drawPlayer(pitchPlayers[id]);
        }

        // Draw ball on top
        drawBall();

        requestAnimationFrame(gameLoop);
    }

    function resetBall() {
        ball.x = W / 2;
        ball.y = H / 2;
        ball.vx = 0;
        ball.vy = 0;
    }

    // Start the game loop immediately
    gameLoop();

    // ================================================
    // MATCH TIMER
    // ================================================
    function startMatchTimer() {
        if (timerInterval) return;
        timerInterval = setInterval(() => {
            matchSeconds++;
            const mins = String(Math.floor(matchSeconds / 60)).padStart(2, '0');
            const secs = String(matchSeconds % 60).padStart(2, '0');
            document.getElementById('match-timer').textContent = `⏱ ${mins}:${secs}`;
        }, 1000);
    }

    // ================================================
    // SOCKET — RECEIVE OTHER PLAYERS' POSITIONS
    // ================================================
    socket.on('player_positions', (players) => {
        for (const id in players) {
            if (id === socket.id) continue; // skip myself
            pitchPlayers[id] = {
                ...players[id],
                isMe: false
            };
        }
        // Remove players who left
        for (const id in pitchPlayers) {
            if (!players[id] && id !== socket.id) {
                delete pitchPlayers[id];
            }
        }
    });

    // ================================================
    // TEAM LOBBY FUNCTIONS
    // ================================================
    function createTeam() {
        const username = document.getElementById('username-input').value.trim();
        const teamName = document.getElementById('team-name-input').value.trim();
        if (!username || !teamName) {
            alert('Enter your baller name AND crew name!');
            return;
        }
        myUsername = username;

        // Spawn my player on the LEFT side (home)
        myPlayer = {
            x: 200, y: H / 2,
            username: username,
            isHome: true,
            isMe: true
        };
        pitchPlayers[socket.id] = myPlayer;

        socket.emit('create_street_team', { username, teamName });
        startMatchTimer();
    }

    function showJoinPanel() {
        const jp = document.getElementById('join-panel');
        jp.style.display = jp.style.display === 'none' ? 'block' : 'none';
    }

    function joinTeam() {
        const username = document.getElementById('username-input').value.trim();
        const code = document.getElementById('invite-code-input')
            .value.trim().toUpperCase();
        if (!username || !code) {
            alert('Enter your baller name AND the invite code!');
            return;
        }
        myUsername = username;

        // Spawn my player on the RIGHT side (away)
        myPlayer = {
            x: W - 200, y: H / 2,
            username: username,
            isHome: false,
            isMe: true
        };
        pitchPlayers[socket.id] = myPlayer;

        socket.emit('join_street_team', { username, inviteCode: code });
        startMatchTimer();
    }

    // --- SERVER RESPONSES ---
    socket.on('team_created', (data) => {
        document.getElementById('home-team-name').textContent = data.teamName;
        const inviteBox = document.getElementById('invite-box');
        inviteBox.style.display = 'block';
        inviteBox.innerHTML = `
            <strong>🔗 Share this code with your crew:</strong><br>
            <span style="font-size:1.4rem;letter-spacing:3px;">
                ${data.inviteCode}
            </span><br>
            <small style="color:#666;">
                WhatsApp it: "Join my AGBA BALLER crew! Code: ${data.inviteCode}"
            </small>`;
        updatePlayerList(data.players);
        addChatMsg('system', `🏟️ Crew "${data.teamName}" created! You are the Captain.`);
    });

    socket.on('player_joined', (data) => {
        updatePlayerList(data.players);
        addChatMsg('system',
            `⚽ ${data.username} joined the crew! (${data.players.length}/5)`);
    });

    socket.on('error_message', (data) => {
        addChatMsg('system', `⚠️ ${data.msg}`);
    });

    function updatePlayerList(players) {
        const list = document.getElementById('player-list');
        list.innerHTML = players.map(p =>
            `<li>${p.role === 'Captain' ? '👑' : '⚽'} ${p.username} 
            <span style="color:#555;font-size:0.7rem;">${p.role}</span></li>`
        ).join('');
    }

    // ================================================
    // CHAT FUNCTIONS
    // ================================================
    function sendMessage() {
        const input = document.getElementById('msg-input');
        const txt = input.value.trim();
        if (!txt) return;
        addChatMsg('sent', `[🔒 Encrypted & Sent]: ${txt}`);
        input.value = '';
    }
    function sendSlang(phrase) {
        addChatMsg('sent', `[Quick Slang]: ${phrase}`);
    }
    function simulateVoiceNote() {
        addChatMsg('sent', '[🎙️ Voice Note]: Audio packet encrypted and sent.');
    }
    function simulateCall() {
        addChatMsg('call', '[📞 WebRTC]: Opening peer-to-peer audio tunnel... Connected!');
    }
    function addChatMsg(type, text) {
        const log = document.getElementById('chat-log');
        const p = document.createElement('p');
        p.className = `msg-${type}`;
        p.textContent = text;
        log.appendChild(p);
        log.scrollTop = log.scrollHeight;
    }
    </script>
</body>
</html>
